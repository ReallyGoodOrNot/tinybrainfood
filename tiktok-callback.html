<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok sign-in · tiny brain food</title><link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--coral:#FF7A59;--pink:#FF3D7F;--plum:#2B1240;--yellow:#FFE45C;--bg:#fff7f4;--text:#2B1240}
@media (prefers-color-scheme: dark){:root{--bg:#1a0f22;--text:#f6eef8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 Inter,system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;padding:40px 16px;text-align:center}
header img{width:96px;height:96px;border-radius:24px;border:4px solid #fff}
header h1{font-family:Fredoka;font-weight:700;font-size:44px;margin:12px 0 4px}
.tag{display:inline-block;background:var(--yellow);color:var(--plum);font-family:Fredoka;font-weight:600;padding:4px 16px;border-radius:12px}
main{max-width:720px;margin:0 auto;padding:32px 16px}h2{font-family:Fredoka}a{color:var(--pink)}
footer{text-align:center;padding:24px 16px;opacity:.7;font-size:14px}
</style></head><body>
<header><img src="logo.svg" alt="tiny brain food logo"><h1>tiny brain food</h1><span class="tag">Your daily dose of "wait, what?"</span></header>
<main>
<h2>TikTok sign-in</h2>
<p id="msg">Reading the sign-in code…</p>
<p><code id="code" style="font-size:20px;word-break:break-all;background:#fff;color:#2B1240;padding:8px 12px;border-radius:8px;display:inline-block"></code></p>
<p><button id="copy" style="font:600 18px Inter,sans-serif;padding:10px 20px;border-radius:12px;border:0;background:#FF3D7F;color:#fff;display:none">Copy code</button></p>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code'), err = q.get('error_description') || q.get('error');
const msg = document.getElementById('msg');
if (code) {
  msg.textContent = 'Signed in. Copy this code and send it to Claude (it works once and expires in a few minutes):';
  document.getElementById('code').textContent = code;
  const b = document.getElementById('copy'); b.style.display = 'inline-block';
  b.onclick = () => navigator.clipboard.writeText(code).then(() => b.textContent = 'Copied ✓');
} else {
  msg.textContent = err ? 'TikTok sign-in failed: ' + err : 'No sign-in code here. Start the sign-in again.';
}
</script>
</main><footer><a href="./">Home</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · tinybrainfood@gmail.com</footer></body></html>
